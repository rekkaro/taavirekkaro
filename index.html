<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>taavi rekkaro</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Official website and portfolio of taavi rekkaro, a multidisciplinary artist working with installation and conceptual media.">
    <meta name="keywords" content="taavi rekkaro, conceptual artist, installation art, fine art, tallinn, time project">
    <link rel="canonical" href="https://taavirekkaro.com/">

    <style>
        /* ---------- base ---------- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: row;
            min-height: 100vh;
        }
        img { display: block; max-width: 100%; }
        a { color: inherit; text-decoration: none; cursor: pointer; }
        button { font: inherit; color: inherit; background: none; cursor: pointer; }
        ul { list-style: none; }
        a:focus-visible, button:focus-visible { outline: 1px solid #000; outline-offset: 2px; }

        /* ---------- sidebar ---------- */
        #menu-button {
            display: none;
            position: fixed; top: 0; left: 0; z-index: 20;
            padding: 1rem;
            font-weight: 700; color: #111827; text-transform: lowercase;
        }
        #sidebar {
            width: 16rem;
            flex-shrink: 0;
            min-height: 100vh;
            position: sticky;
            top: 0;
            z-index: 10;
            background: #fff;
            padding: 2rem;
            border-right: 1px solid #f3f4f6;
        }
        #sidebar h1 { font-size: 1.25rem; line-height: 1.75rem; font-weight: 700; margin-bottom: 2rem; text-transform: lowercase; }
        .nav-group + .nav-group { margin-top: 1rem; }
        .nav-link, .nav-item {
            display: block;
            padding: 0.25rem 0;
            color: #6b7280;
            text-transform: lowercase;
            transition: all 0.15s;
        }
        .nav-list { margin-top: 0.5rem; padding-left: 1rem; }
        .nav-list li + li { margin-top: 0.25rem; }
        .nav-item:hover { color: #000; }
        .nav-link.active, .nav-item.active { color: #000; }
        #close-button {
            display: none;
            position: absolute; top: 1rem; right: 1rem;
            font-size: 1.25rem; line-height: 1.75rem; font-weight: 700;
        }

        /* ---------- content ---------- */
        #content-area { flex-grow: 1; min-width: 0; width: 100%; padding: 3rem 6rem; }
        .content-section { display: none; }

        .page-title { font-size: 1.875rem; line-height: 2.25rem; font-weight: 300; text-transform: lowercase; margin-bottom: 0.75rem; }
        .page-title.spaced { margin-bottom: 4rem; }

        .meta {
            margin-bottom: 1rem; max-width: 36rem;
            font-size: 0.875rem; line-height: 1.625; font-weight: 300;
            color: #374151; text-transform: lowercase;
        }
        .meta > * + * { margin-top: 0.5rem; }
        .details { padding-top: 0.5rem; font-size: 0.75rem; line-height: 1rem; color: #4b5563; border-top: 1px solid #f3f4f6; }
        .details > * + * { margin-top: 0.25rem; }

        .gallery {
            display: flex; flex-wrap: nowrap; gap: 1rem;
            overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 0.25rem 0 0.5rem; width: 100%;
        }
        .gallery-img {
            height: calc(100vh - 16.5rem);
            max-height: calc(100vh - 16.5rem);
            min-height: 260px;
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
            scroll-snap-align: start;
        }

        .text-block {
            margin-top: 3rem; padding-top: 1.5rem; padding-bottom: 4rem; max-width: 36rem;
            font-size: 0.875rem; line-height: 1.625; font-weight: 300; color: #374151;
            border-top: 1px solid #f3f4f6;
        }
        .text-block > * + * { margin-top: 1rem; }
        .text-block .label { font-weight: 400; color: #000; text-transform: lowercase; }
        .credits { font-size: 0.75rem; line-height: 1rem; color: #6b7280; text-transform: lowercase; }
        .credits > * + * { margin-top: 0.125rem; }
        .quote { margin: 1rem 0; padding: 0.5rem 0 0.5rem 1rem; border-left: 1px solid #e5e7eb; color: #000; }
        .quote > * + * { margin-top: 0.5rem; }
        .quote p { font-style: italic; }
        .pull { padding-left: 1rem; font-style: italic; color: #000; font-weight: 400; }

        /* small helpers used inside the texts */
        .black { color: #000; }
        .normal { font-weight: 400; }
        .lc { text-transform: lowercase; }
        .xs { font-size: 0.75rem; line-height: 1rem; }
        .gray { color: #6b7280; }
        .mt-1 { margin-top: 0.25rem; }
        .pt-1 { padding-top: 0.25rem; }

        .index { font-size: 0.875rem; line-height: 1.25rem; color: #374151; text-transform: lowercase; }
        .index > * + * { margin-top: 0.5rem; }
        .index a:hover { text-decoration: underline; }

        .about-body { max-width: 42rem; color: #374151; }
        .about-body > * + * { margin-top: 1rem; }
        .email { padding-top: 1rem; font-size: 0.875rem; line-height: 1.25rem; color: #000; }
        .email a:hover { text-decoration: underline; }

        #time-display {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1rem; letter-spacing: 0.1em; font-weight: 50; white-space: nowrap;
        }

        /* ---------- mobile ---------- */
        @media (max-width: 768px) {
            body { padding-top: 3rem; flex-direction: column; }
            #menu-button, #close-button { display: block; }
            #sidebar {
                position: fixed; top: 0; left: -100%;
                width: 100%; height: 100%; overflow-y: auto;
                transition: left 0.3s ease-in-out;
            }
            #sidebar.open { left: 0; }
            #content-area { padding: 1.5rem 1rem 3rem 1rem; }
            .page-title { font-size: 1.5rem; line-height: 2rem; }
            .gallery-img { height: 55vh; max-height: 55vh; }
        }

        /* ---------- minimal scrollbars ---------- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #ffffff; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
        * { scrollbar-width: thin; scrollbar-color: #e5e7eb #ffffff; }
    </style>
</head>
<body>

    <button id="menu-button" type="button">menu</button>

    <aside id="sidebar">
        <h1>taavi rekkaro</h1>
        <nav id="nav"></nav>
        <button id="close-button" type="button" aria-label="close menu">&times;</button>
    </aside>

    <main id="content-area">
        <section id="home-content" class="content-section"></section>

        <section id="about-content" class="content-section">
            <h2 class="page-title spaced">about</h2>
            <div class="about-body">
                <p>Taavi Rekkaro (b. 1988, Estonia) studied printmaking at Estonian Academy of Arts. He is working to explore connections between painting and photography while trying to avoid any writing.</p>
                <p class="email"><a href="mailto:something@taavirekkaro.com">something@taavirekkaro.com</a></p>
            </div>
        </section>
        <!-- exhibition and project pages are built automatically from the lists below -->
    </main>

    <script>
    /* =====================================================================
       YOUR CONTENT — this is the only part you need to edit.

       To add a new show or project:
         1. Make a folder next to index.html (e.g.  thanks/ ) and put the photos in it.
         2. Copy one block below, change the id, menu name, folder and photos.
         3. The menu, the overview page and the photo page appear by themselves.

       Photos can be listed two ways:
         images: ['first.jpg', 'second.jpg']      -> shown in this order
         count: 8                                 -> uses 1.jpg, 2.jpg ... 8.jpg
         (add  ext: 'jpeg'  if your files end in .jpeg)

       Extra options:
         draft: true   -> page works by its link, but is hidden from the menu
         text: `...`   -> text under the photos (leave out if not needed)
       Order in each list = order in the menu (newest first).
       ===================================================================== */

    const EXHIBITIONS = [
        {
            id: 'do-i-need-to-say-it-out-myself-2026',
            menu: 'do i need to say it out myself? 2026',
            title: '“do i need to say it out myself?” 2026',
            folder: '',   // these photos sit next to index.html
            images: [
                { file: '01_foku_overview_taavi-rekkaro-skog.jpeg', alt: 'foku overview' },
                { file: '02_Nyc_beers_2025_2026-skog.jpeg', alt: 'nyc beers' },
                { file: '03_vosu dream_1_5_2024-skog.jpeg', alt: 'vosu dream' },
                { file: '04_sweaty paris toilet_2026-skog.jpeg', alt: 'sweaty paris toilet' },
                { file: '05_needle vail_2025_2026-skog.jpeg', alt: 'needle vail' },
                { file: '06_nida still angry_2025_2026-skog.jpeg', alt: 'nida still angry' },
                { file: '07_a classic american pool_2025-skog.jpeg', alt: 'a classic american pool' },
                { file: '08_bastad decor_2026-skog.jpeg', alt: 'bastad decor' },
                { file: '09_kutaisi wave_variation 1_2024_2026-skog.jpeg', alt: 'kutaisi wave' },
                { file: '10_touching table-skog.jpeg', alt: 'touching table' }
            ],
            meta: `
                <div>
                    <p class="black">“do i need to say it out myself?”</p>
                    <p class="mt-1">taavi rekkaro</p>
                </div>
                <div class="details">
                    <p>duo show with hilla kurki “something that should be felt”</p>
                    <p class="black">foku gallery</p>
                    <p>06.08 - 26.09.2026</p>
                </div>`,
            text: `
                <div class="credits">
                    <p class="black normal">“do i need to say it out myself?”</p>
                    <p>taavi rekkaro</p>
                    <p>foku gallery</p>
                    <p>august-september 2026</p>
                </div>
                <p>A moment before i didn’t know what i was feeling, although my gut, my body already knew. Instead i had to listen to myself, which brought out those words with a strange sparkle. How to better understand my problems, those that need to live with me. Mistakes that gain strength or are hidden according to the phase of the moon, the sun, hunger, or when was the last time i had sex?</p>
                <p>The photos and “objects” on display treat photography as something that should be felt, that has its own memory and where closeness becomes part of the experience. Together, the artworks create a dialogue between distance and intimacy. Moments in everyday life, asking how do we stay connected to what is important. How can we be sure you even were there - were those moments real? What have you lost to confusion or simply forgotten? Fleeting moments captured as photos, quotes, text, paintings, sculptures or who knows in what shape.</p>
                <p>This series is an attempt to replace a crushing core belief and to find a way to find the part that’s actually important. On the gallery wall is a melting moment, consisting of works starting from 2023. Captured moments with good friends, from places full of emotions or just to feel alive or just a little bit good. To be present and to listen what the body/mind is looking to catch.</p>
                <p>The exhibition wall where time could dissolve, but next to it where you can spend time. The wall doesn’t hold a single story, but you should have time to find your own narrative.</p>
                <div class="quote">
                    <p>“Margus* waits and looks at me. I wait and look at him.</p>
                    <p>I ask: “Do i have to say it out myself?</p>
                    <p>Margus looks,<br>Margus widens his eyes and nods slightly.</p>
                    <p>I answer: “Because I am a bad person.””</p>
                </div>
                <p class="xs gray">conversation March 2021<br>*psychologist Margus</p>`
        },
        {
            id: 'i-would-never-remember-2026',
            menu: 'i would never remember 2026',
            title: 'i would never remember saying something so stupid, 2026',
            folder: 'i would never',
            images: [
                '2026_VS_Taavi_WebRes_1.jpg',
                '2026_VS_Taavi_HighRes_text_1.jpg',
                '2026_VS_Taavi_WebRes_2.jpg',
                '2026_VS_Taavi_WebRes_3.jpg',
                '2026_VS_Taavi_HighRes_text_2.jpg',
                '2026_VS_Taavi_WebRes_5.jpg',
                '2026_VS_Taavi_WebRes_6.jpg',
                '2026_VS_Taavi_WebRes_7.jpg',
                '2026_VS_Taavi_WebRes_8.jpg',
                '2026_VS_Taavi_WebRes_9.jpg',
                '2026_VS_Taavi_WebRes_10.jpg'
            ],
            meta: `
                <div>
                    <p class="black">i would never remember<br>saying something so stupid*</p>
                    <p class="mt-1">taavi rekkaro</p>
                    <p class="xs gray mt-1">*said by tor, london morning<br>16.05.2026</p>
                </div>
                <div class="details">
                    <p>summer solo show, presented at</p>
                    <p class="black">vasli souza båstad</p>
                    <p>10.07 - 02.08.26</p>
                    <p class="pt-1 gray">installation views by: kunstdok // tor s. ulstein</p>
                </div>`,
            text: `
                <p class="lc">In May of 2026, rasmus, tor and taavi went to visit the photo london art fair. the title of this show is from one of those mornings: taavi read out a memory from the previous night, where his good friend tor tried to get to the root of their cause.</p>
                <p class="pull lc">“we like to be like sad jazz<br>we want to be like sad jazz”</p>
                <p class="lc">without writing down, this or these moments would just be lived but forgotten. (it’s also fun to see tor reacting to his past thoughts.</p>
                <p class="lc">for taavi, catching moments is sacred. how can you be sure you even were there - did these moments truly exist? what have you lost if they get mangled up or simply forgotten?</p>
                <p class="lc">in his process taavi is trying to catch fleeting moments like these - whether they come in the shape of photos, quotes, texts, paintings, sculptures or pieces of tape. presented in vasli souza, båstad, is a similar dissolving snapshot of taavi’s ongoing project, consisting of photos and sculptures starting from 2023. captured moments of good friends, places full of emotions and just trying to feel alive or just a bit happy.</p>`
        }
    ];

    const PROJECTS = [
        { id: 'time', menu: 'time', type: 'time' },
        {
            id: 'all-a-day',
            menu: "it's all a day - 2025",
            folder: 'all-a-day',
            images: []        // add photo file names here, or use  count: 10
        },
        {
            id: 'silent-scream',
            menu: 'silent scream - 2025',
            folder: 'silent-scream',
            images: []
        },
        {
            id: 'thanks',
            menu: 'thanks for everything',
            folder: 'thanks',
            images: []
        }
    ];

    /* =====================================================================
       Site code below — no need to touch.
       ===================================================================== */

    const BASE_TITLE = 'taavi rekkaro';
    const START_TIME = Date.UTC(2024, 11, 8, 10, 56, 0);
    const GROUPS = [
        { key: 'exhibitions', label: 'exhibitions', items: EXHIBITIONS, textLabel: 'exhibition text:' },
        { key: 'projects', label: 'projects', items: PROJECTS, textLabel: 'text:' }
    ];
    const ROUTES = {};

    const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

    function photosOf(item) {
        let list = item.images || [];
        if (!list.length && item.count) {
            list = Array.from({ length: item.count }, (_, i) => `${i + 1}.${item.ext || 'jpg'}`);
        }
        return list.map((entry, i) => {
            const file = typeof entry === 'string' ? entry : entry.file;
            const alt = typeof entry === 'string' ? `${item.menu} - ${i + 1}` : entry.alt;
            return { src: encodeURI(item.folder ? `${item.folder}/${file}` : file), alt: `taavi rekkaro - ${alt}` };
        });
    }

    function buildPage(item, group) {
        const section = document.createElement('section');
        section.id = `${item.id}-content`;
        section.className = 'content-section';

        if (item.type === 'time') {
            section.innerHTML = `<h2 class="page-title spaced">${item.title || item.menu}</h2>
                                 <div id="time-display">--:--:--.--</div>`;
            return section;
        }

        let html = `<h2 class="page-title">${item.title || item.menu}</h2>`;
        if (item.meta) html += `<div class="meta">${item.meta}</div>`;

        const photos = photosOf(item);
        if (photos.length) {
            html += `<div class="gallery">` + photos.map((p, i) =>
                `<img src="${p.src}" alt="${esc(p.alt)}" class="gallery-img" decoding="async"${i > 1 ? ' loading="lazy"' : ''}>`
            ).join('') + `</div>`;
        }

        if (item.text) {
            const label = item.textLabel ?? group.textLabel;
            html += `<div class="text-block">${label ? `<p class="label">${label}</p>` : ''}${item.text}</div>`;
        }

        section.innerHTML = html;
        return section;
    }

    function buildOverview(group, visible) {
        const section = document.createElement('section');
        section.id = `${group.key}-content`;
        section.className = 'content-section';
        section.innerHTML = `<h2 class="page-title spaced">${group.label}</h2>
            <div class="index">${visible.map(it => `<div><a href="#${it.id}">${it.menu}</a></div>`).join('')}</div>`;
        return section;
    }

    function buildSite() {
        const nav = document.getElementById('nav');
        const main = document.getElementById('content-area');
        const about = document.getElementById('about-content');
        let navHtml = '';

        GROUPS.forEach(group => {
            const visible = group.items.filter(it => !it.draft);
            navHtml += `<div class="nav-group">
                <a href="#${group.key}" id="nav-${group.key}" class="nav-link">${group.label}</a>
                <ul class="nav-list">${visible.map(it =>
                    `<li><a href="#${it.id}" id="link-${it.id}" class="nav-item">${it.menu}</a></li>`).join('')}
                </ul></div>`;

            main.insertBefore(buildOverview(group, visible), about);
            ROUTES[group.key] = { group: group.key };
            group.items.forEach(item => {
                main.insertBefore(buildPage(item, group), about);
                ROUTES[item.id] = { group: group.key, item: item.id, title: item.menu };
            });
        });

        navHtml += `<div class="nav-group"><a href="#about" id="nav-about" class="nav-link">about</a></div>`;
        ROUTES.about = { group: 'about' };
        nav.innerHTML = navHtml;

        nav.addEventListener('click', e => {
            if (e.target.closest('a') && window.innerWidth <= 768) closeMenu();
        });
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
    function closeMenu() { document.getElementById('sidebar').classList.remove('open'); }

    function renderContent() {
        let hash = decodeURIComponent(window.location.hash.slice(1)) || 'home';
        if (!document.getElementById(`${hash}-content`)) hash = 'home';

        document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.nav-link, .nav-item').forEach(l => l.classList.remove('active'));
        document.getElementById(`${hash}-content`).style.display = 'block';

        const route = ROUTES[hash] || {};
        if (route.group) document.getElementById(`nav-${route.group}`)?.classList.add('active');
        if (route.item) document.getElementById(`link-${route.item}`)?.classList.add('active');
        document.title = route.title ? `${BASE_TITLE} - ${route.title}` : BASE_TITLE;
        window.scrollTo(0, 0);
    }

    function updateTimer() {
        const el = document.getElementById('time-display');
        if (!el) return;
        const totalElapsedMs = Date.now() - START_TIME;
        let totalSeconds = Math.floor(totalElapsedMs / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        totalSeconds %= 3600;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const hundredths = Math.floor((totalElapsedMs % 1000) / 10);
        el.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(hundredths).padStart(2, '0')}`;
    }

    document.getElementById('menu-button').addEventListener('click', toggleMenu);
    document.getElementById('close-button').addEventListener('click', toggleMenu);
    window.addEventListener('hashchange', renderContent);

    buildSite();
    renderContent();
    updateTimer();
    setInterval(updateTimer, 10);
    </script>
</body>
</html>
